name: Publish to Google Play (internal track)

# OPTIONAL: needs a Play Console account. The 'play-internal' environment should require a reviewer, so the secrets
# are only exposed after manual approval.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-android
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease --console=plain
      - name: Upload to Play (internal testing)
        env:
          # Prefer Workload Identity Federation over a long-lived JSON key; a key is the simpler (less safe) option.
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Upload step intentionally left to the Gradle Play Publisher / upload action of your choice:"
          echo "pin it to a full commit SHA, then pass app/build/outputs/bundle/release/*.aab to the internal track."
          exit 1
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
