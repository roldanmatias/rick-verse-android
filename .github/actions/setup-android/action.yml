name: Setup Android build
description: JDK + Gradle (with caching). Call after actions/checkout. Android SDK is preinstalled on ubuntu-latest.

inputs:
  java-version:
    description: JDK that runs Gradle (matches gradle/gradle-daemon-jvm.properties). Bytecode still targets Java 17.
    default: "25"
  cache-read-only:
    description: Never write the Gradle cache (use for PRs from forks and non-default branches).
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-read-only == 'true' || github.ref != 'refs/heads/main' }}
        add-job-summary-as-pr-comment: never
